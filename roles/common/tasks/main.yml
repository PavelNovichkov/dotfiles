- name: "make the ssh directory private"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"

- name: "install dotfiles"
  loop:
    - bash
    - env
    - fish
    - git
    - go
    - julia
    - readline
    - ssh
    - tex
    - tmux
  ansible.builtin.copy:
    src: "{{ item }}/"
    dest: "{{ ansible_facts['user_dir'] }}/"
    mode: preserve

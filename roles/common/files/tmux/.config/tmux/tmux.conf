# Fish shell
set -g default-command fish

# A better prefix key
unbind-key C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Zero escape delay
set -sg escape-time 0

# Start counting at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# Intuitive splits
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Vim-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
# smoother scrolling
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=default,dim"
set -g status-left-length 40
set -g status-right-length 40
set -g status-left "#[nodim,bold]#S #{?client_prefix,#[fg=colour3]● ,#[dim]● }"
set -g status-right "#[dim]%H:%M"

# Windows
setw -g window-status-format "#[dim]#W"
setw -g window-status-current-format "#[nodim,bold]#W"
setw -g window-status-separator "  "
setw -g window-status-activity-style "fg=colour3"

# Panes and messages
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=default"
set -g message-style "bg=default,fg=default,bold"
set -g mode-style "reverse,dim"

# SSH agent forwarding
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY SSH_CONNECTION"
set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/agent.sock"

# Modern terminal features
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"  # truecolour
set -as terminal-features ",*:hyperlinks"  # OSC 8 clickable links
set -as terminal-features ",*:clipboard"  # OSC 52 passthrough
set -as terminal-features ",*:usstyle"  # curly/coloured underlines
set -as terminal-features ",*:extkeys"  # modifyOtherKeys / kitty keyboard
set -s extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on

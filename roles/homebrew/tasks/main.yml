- name: "determine whether the prefix requires superuser privileges"
  ansible.builtin.set_fact:
    # The standard Linuxbrew prefix lives outside of $HOME and can only be
    # created by root; a custom prefix is assumed to be user-writable.
    homebrew_privileged: "{{ homebrew_prefix == '/home/linuxbrew/.linuxbrew' }}"

- name: "create the prefix"
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0755"
  become: "{{ homebrew_privileged }}"

- name: "clone the repository"
  ansible.builtin.git:
    repo: https://github.com/Homebrew/brew.git
    dest: "{{ homebrew_prefix }}/Homebrew"
    # Leave an existing checkout alone: it is updated by `brew update`, not by us.
    update: false
  register: homebrew_clone

- name: "create the bin directory"
  ansible.builtin.file:
    path: "{{ homebrew_prefix }}/bin"
    state: directory
    mode: "0775"

- name: "link the brew executable into the prefix"
  ansible.builtin.file:
    src: ../Homebrew/bin/brew
    dest: "{{ homebrew_prefix }}/bin/brew"
    state: link

- name: "install"
  ansible.builtin.command:
    cmd: "{{ homebrew_prefix }}/bin/brew update --force --quiet"
  when: homebrew_clone is changed
  changed_when: true

- name: "set up environment"
  ansible.builtin.template:
    src: homebrew.conf.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/environment.d/homebrew.conf"
    mode: "0644"

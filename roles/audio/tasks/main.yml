- name: "realtime setup"
  become: true
  ansible.builtin.package:
    name:
      - realtime-setup
    state: present

- name: "add user to realtime group"
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: realtime
    append: true

- name: "install flatpaks"
  community.general.flatpak:
    state: present
    name:
      - fm.reaper.Reaper
      - org.freedesktop.LinuxAudio.Plugins.DragonflyReverb//24.08
      - org.freedesktop.LinuxAudio.Plugins.guitarixvst//24.08
      - org.freedesktop.LinuxAudio.Plugins.LSP//24.08
      - org.freedesktop.LinuxAudio.Plugins.Surge//24.08
      - org.pipewire.Helvum
      - org.pulseaudio.pavucontrol
